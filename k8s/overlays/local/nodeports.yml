apiVersion: v1
kind: Service
metadata:
  name: minirtos-backend-nodeport
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-backend
spec:
  type: NodePort
  selector:
    app: minirtos-backend
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081

---
apiVersion: v1
kind: Service
metadata:
  name: minirtos-frontend-nodeport
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-frontend
spec:
  type: NodePort
  selector:
    app: minirtos-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
