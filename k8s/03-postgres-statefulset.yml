apiVersion: v1
kind: Service
metadata:
  name: minirtos-postgres
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-postgres
spec:
  type: ClusterIP
  selector:
    app: minirtos-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minirtos-postgres-data
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minirtos-postgres
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-postgres
spec:
  serviceName: minirtos-postgres
  replicas: 1
  selector:
    matchLabels:
      app: minirtos-postgres
  template:
    metadata:
      labels:
        app: minirtos-postgres
        app.kubernetes.io/name: minirtos-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: minirtos-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: minirtos-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minirtos-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: minirtos-postgres-data
