apiVersion: v1
kind: Service
metadata:
  name: minirtos-frontend
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app: minirtos-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minirtos-frontend
  namespace: minirtos
  labels:
    app.kubernetes.io/name: minirtos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minirtos-frontend
  template:
    metadata:
      labels:
        app: minirtos-frontend
        app.kubernetes.io/name: minirtos-frontend
    spec:
      containers:
        - name: frontend
          image: minirtos-frontend-placeholder:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
