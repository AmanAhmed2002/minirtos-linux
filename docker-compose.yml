services:
  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-demo
    command: ./scripts/run_docker_demo.sh
    volumes:
      - ./logs:/app/logs
      - ./reports/generated:/app/reports/generated
      - ./models:/app/models

  runtime-normal:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-normal
    command: ./scripts/run_normal.sh
    volumes:
      - ./logs:/app/logs

  runtime-priority:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-priority
    command: ./cpp-runtime/build/minirtos_runtime --config configs/priority_scheduler.json
    volumes:
      - ./logs:/app/logs

  runtime-deadline:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-deadline
    command: ./cpp-runtime/build/minirtos_runtime --config configs/deadline_scheduler.json
    volumes:
      - ./logs:/app/logs

  runtime-queue-overflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-queue-overflow
    command: ./cpp-runtime/build/minirtos_runtime --config configs/queue_overflow.json
    volumes:
      - ./logs:/app/logs

  runtime-cpu-spike:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-cpu-spike
    command: ./cpp-runtime/build/minirtos_runtime --config configs/cpu_spike.json
    volumes:
      - ./logs:/app/logs
    
  runtime-task-crash:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-task-crash
    command: ./cpp-runtime/build/minirtos_runtime --config configs/task_crash.json
    volumes:
      - ./logs:/app/logs
  runtime-slow-task:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-slow-task
    command: ./scripts/run_fault.sh configs/slow_task.json
    volumes:
      - ./logs:/app/logs

  runtime-dropped-messages:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-dropped-messages
    command: ./scripts/run_fault.sh configs/dropped_messages.json
    volumes:
      - ./logs:/app/logs

  runtime-watchdog:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-runtime-watchdog
    command: ./scripts/run_watchdog.sh
    volumes:
      - ./logs:/app/logs

  analyzer:
    build:
      context: .
      dockerfile: docker/Dockerfile.analyzer
    container_name: minirtos-analyzer
    command: ./scripts/run_analyzer.sh logs/runtime_logs.jsonl 5000
    volumes:
      - ./logs:/app/logs
  training-dataset:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-training-dataset
    command: >
      python3 ai-analyzer/training/generate_dataset.py
      --output reports/generated/synthetic_dataset.csv
      --window-ms 5000
      --scenario normal=logs/normal_runtime_logs.jsonl
      --scenario priority_scheduler=logs/priority_scheduler_runtime_logs.jsonl
      --scenario deadline_scheduler=logs/deadline_scheduler_runtime_logs.jsonl
      --scenario queue_overflow=logs/queue_overflow_runtime_logs.jsonl
      --scenario cpu_spike=logs/cpu_spike_runtime_logs.jsonl
      --scenario task_crash=logs/task_crash_runtime_logs.jsonl
      --scenario slow_task=logs/slow_task_runtime_logs.jsonl
      --scenario dropped_messages=logs/dropped_messages_runtime_logs.jsonl
      --scenario watchdog=logs/watchdog_runtime_logs.jsonl
    volumes:
      - ./logs:/app/logs
      - ./reports/generated:/app/reports/generated 
  ml-train:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-ml-train
    command: >
      python3 ai-analyzer/ml/train_model.py
      --dataset reports/generated/synthetic_dataset.csv
      --model-output models/anomaly_classifier.joblib
      --label-encoder-output models/label_encoder.joblib
      --metrics-output reports/generated/model_metrics.json
    volumes:
      - ./reports/generated:/app/reports/generated
      - ./models:/app/models

  ml-predict:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: minirtos-ml-predict
    command: >
      python3 ai-analyzer/ml/predict_model.py
      --model models/anomaly_classifier.joblib
      --label-encoder models/label_encoder.joblib
      --dataset reports/generated/synthetic_dataset.csv
      --limit 20
    volumes:
      - ./reports/generated:/app/reports/generated
      - ./models:/app/models
