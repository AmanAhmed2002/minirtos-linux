name: Sync RDS Secret

# The RDS master password is AWS-managed and rotates automatically every
# 7 days. This workflow keeps the Kubernetes database Secret in sync so the
# backend does not start failing with "password authentication failed" after
# a rotation. The sync script is a no-op unless the password changed.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: minirtos-aws-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Sync RDS password into Kubernetes Secret
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The environment can be fully torn down by texting DESTROY, in which case
      # there is no cluster and no database to sync. Skipping keeps this hourly
      # job from failing continuously while everything is intentionally down.
      - name: Check whether the environment exists
        id: environment
        run: |
          if aws eks describe-cluster \
              --name "${{ vars.EKS_CLUSTER_NAME }}" \
              --region "${{ vars.AWS_REGION }}" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No EKS cluster; the environment is torn down. Nothing to sync."
          fi

      - name: Install kubectl
        if: steps.environment.outputs.present == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"

      - name: Update kubeconfig
        if: steps.environment.outputs.present == 'true'
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Sync database Secret
        if: steps.environment.outputs.present == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RDS_DATABASE_NAME: ${{ vars.RDS_DATABASE_NAME }}
          RDS_USERNAME: ${{ vars.RDS_USERNAME }}
        run: |
          # Resolved live rather than from a repository variable: rebuilding the
          # environment creates a new managed secret with a new random suffix, so
          # a stored ARN goes stale the first time DESTROY/START is used.
          RDS_SECRET_ARN="$(aws rds describe-db-instances \
            --db-instance-identifier minirtos-dev-postgres \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)"
          if [[ -z "$RDS_SECRET_ARN" || "$RDS_SECRET_ARN" == "None" ]]; then
            echo "ERROR: could not resolve the RDS master secret ARN."
            exit 1
          fi
          export RDS_SECRET_ARN
          chmod +x scripts/sync_rds_db_secret.sh
          ./scripts/sync_rds_db_secret.sh

      - name: Smoke test HTTPS app
        if: steps.environment.outputs.present == 'true'
        run: |
          chmod +x scripts/k8s_smoke_test.sh
          ./scripts/k8s_smoke_test.sh "${{ vars.APP_URL }}"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== Kubernetes diagnostics ==="
          kubectl get pods -n minirtos -o wide || true
          kubectl logs deployment/minirtos-backend -n minirtos --tail=100 || true
          kubectl get events -n minirtos --sort-by=.lastTimestamp | tail -30 || true
